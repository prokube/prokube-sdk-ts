name: Release Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e '
            const version = require("./package.json").version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              console.error(`package.json version "${version}" is not semver X.Y.Z`);
              process.exit(1);
            }
            const expected = `v${version}`;
            const actual = process.env.RELEASE_TAG;
            if (expected !== actual) {
              console.error(`Expected release tag ${expected} but got ${actual}`);
              process.exit(1);
            }
          '

      - name: Build, pack, and smoke test npm production install
        run: npm run smoke:release:npm

      - name: Prepare tagged release asset
        if: github.event_name == 'release'
        run: cp ./.artifacts/*.tgz "./.artifacts/prokube-${{ github.event.release.tag_name }}.tgz"

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "./.artifacts/prokube-${{ github.event.release.tag_name }}.tgz"

      - name: Upload workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: ./.artifacts/*.tgz
